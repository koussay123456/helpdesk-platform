# ==========================================================================
#  KIPROPHA Help Desk \u2014 configuration de l'application
#
#  Trois valeurs sont \u00E0 adapter \u00E0 votre poste :
#     le nom de la base, l'utilisateur et le mot de passe.
#  Tout le reste peut rester en l'\u00E9tat.
# ==========================================================================

spring.application.name=incidentmanager


# ---------------------------------------------------- BASE DE DONN\u00C9ES ----
# Format de l'URL : jdbc:postgresql://<h\u00F4te>:<port>/<nom de la base>
# Le port 5432 est celui par d\u00E9faut de PostgreSQL.
spring.datasource.url=jdbc:postgresql://localhost:5432/helpdeskDB
spring.datasource.username=postgres
spring.datasource.password=04091425
spring.datasource.driver-class-name=org.postgresql.Driver


# ------------------------------------------------------------ HIBERNATE ----
# none : l'application ne cr\u00E9e ni ne modifie aucune table. Le sch\u00E9ma est
#        celui install\u00E9 par le script bdd-kipropha.sql, et la base reste
#        la seule source de v\u00E9rit\u00E9.
#
# Si vous pr\u00E9f\u00E9rez \u00EAtre averti au d\u00E9marrage d'un \u00E9cart entre les entit\u00E9s
# Java et les tables r\u00E9elles, remplacez none par validate : l'application
# refusera alors de d\u00E9marrer en signalant la colonne fautive. C'est plus
# strict, mais cela \u00E9vite de d\u00E9couvrir le probl\u00E8me au premier clic.
spring.jpa.hibernate.ddl-auto=none

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Affiche les requ\u00EAtes SQL dans la console. Pratique pendant le d\u00E9veloppement,
# \u00E0 passer \u00E0 false ensuite : le journal devient vite illisible.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ------------------------------------------- SCRIPTS D'INITIALISATION ----
# never : aucun script n'est rejou\u00E9 au d\u00E9marrage. Le peuplement se fait une
# seule fois, \u00E0 la main, avec bdd-kipropha.sql dans pgAdmin.
spring.sql.init.mode=never


# ----------------------------------------------------------- SERVEUR ----
server.port=8080
server.error.include-message=always


# ------------------------------------------------------------- JSON ----
# Les dates sont transmises au format ISO (2026-07-27T09:30:00) et non en
# nombre de millisecondes : c'est ce qu'attend l'interface.
spring.jackson.serialization.write-dates-as-timestamps=false


# ------------------------------------------------------ D\u00C9VELOPPEMENT ----
# Red\u00E9marrage automatique \u00E0 chaque recompilation.
spring.devtools.restart.enabled=true
