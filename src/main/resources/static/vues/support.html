<!-- ============ ESPACE SUPPORT IT ============ -->
<div id="supportDashboard" class="dashboard-screen">
    <div class="admin-container">

        <!-- Sidebar : mêmes classes que l'espace Administrateur -->
        <aside class="admin-sidebar-new">
            <div class="sidebar-logo-section">
                <div class="sidebar-logo-icon">
                    <img src="assets/logo-kipropha.png" alt="Kipropha" class="logo-image">
                </div>
            </div>

            <div class="sidebar-identite">
                <i class="fas fa-headset"></i>
                <span class="role">Support IT</span>
                <span class="nom" id="supportIdentite">—</span>
            </div>

            <nav class="sidebar-nav-tabs">
                <button class="sidebar-tab-btn active" data-pane="ouverts" title="Tickets ouverts">
                    <i class="fas fa-inbox"></i>
                    <span class="libelle">Tickets ouverts</span>
                </button>
                <button class="sidebar-tab-btn" data-pane="dashboard" title="Tableau de bord">
                    <i class="fas fa-chart-line"></i>
                    <span class="libelle">Tableau de bord</span>
                </button>
            </nav>

            <button class="sidebar-logout-btn" onclick="logout()" title="Se déconnecter">
                <i class="fas fa-sign-out-alt"></i>
                <span>Déconnecter</span>
            </button>
        </aside>

        <main class="admin-main-content">
            <div class="filigrane-central" aria-hidden="true">
                <img src="assets/logo-kipropha.png" alt="">
            </div>

            <header class="admin-header-new">
                <h1 id="supportPageTitle"><i class="fas fa-table-columns"></i> Kanban global</h1>
                <div class="admin-user-info">
                    <div class="admin-profile-badge">
                        <span class="avatar-profil" id="supportAvatar">—</span>
                        <div class="admin-profile-text">
                            <span class="admin-role">Support IT</span>
                            <span class="admin-name" id="supportNomHeader">—</span>
                        </div>
                    </div>
                </div>
            </header>

            <div class="admin-tabs-wrapper">

                <section class="admin-tab-pane active" data-pane="ouverts">
                    <div class="zone-centree">
                        <div class="outils-table">
                            <input type="search" id="rechercheOuverts" class="champ-recherche"
                                   placeholder="Rechercher un numéro, un titre ou un demandeur…">
                            <select id="filtreOuvertsPriorite" class="filtre-select">
                                <option value="">Toutes les priorités</option>
                                <option value="CRITIQUE">Critique</option>
                                <option value="ELEVEE">Élevée</option>
                                <option value="MOYENNE">Moyenne</option>
                                <option value="FAIBLE">Faible</option>
                            </select>
                            <select id="filtreOuvertsCategorie" class="filtre-select">
                                <option value="">Toutes les catégories</option>
                                <option value="MATERIEL">Matériel</option>
                                <option value="LOGICIEL">Logiciel</option>
                                <option value="RESEAU">Réseau</option>
                                <option value="IMPRIMANTE">Imprimante</option>
                                <option value="AUTRE">Autre</option>
                            </select>
                            <span class="compte-resultats" id="compteOuverts"></span>
                        </div>

                        <div class="table-defilante">
                            <table class="admin-data-table">
                                <thead>
                                <tr>
                                    <th>Identifiant</th><th>Titre</th><th>Catégorie</th>
                                    <th>Priorité</th><th>Demandeur</th><th>Ouvert le</th>
                                    <th style="text-align:center;">Action</th>
                                </tr>
                                </thead>
                                <tbody id="ouvertsTableBody">
                                <tr><td colspan="7" class="etat-vide">Chargement…</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>

                <section class="admin-tab-pane" data-pane="dashboard">
                    <div class="zone-centree">

                        <div class="grille-kpi" id="grilleKpiSupport"></div>

                        <div class="section-bloc">
                            <h3><i class="fas fa-folder-open"></i> Historique de mes tickets</h3>

                            <div class="outils-table">
                                <input type="search" id="rechercheAssignes" class="champ-recherche"
                                       placeholder="Rechercher un numéro, un titre ou un demandeur…">
                                <select id="filtreAssignesStatut" class="filtre-select">
                                    <option value="">Tous les statuts</option>
                                    <option value="NOUVEAU">Nouveau</option>
                                    <option value="EN_COURS">En cours</option>
                                    <option value="RESOLU">Résolu</option>
                                    <option value="FERME">Fermé</option>
                                </select>
                                <select id="filtreAssignesPriorite" class="filtre-select">
                                    <option value="">Toutes les priorités</option>
                                    <option value="CRITIQUE">Critique</option>
                                    <option value="ELEVEE">Élevée</option>
                                    <option value="MOYENNE">Moyenne</option>
                                    <option value="FAIBLE">Faible</option>
                                </select>
                                <span class="compte-resultats" id="compteAssignes"></span>
                            </div>

                            <div class="table-defilante">
                                <table class="admin-data-table">
                                    <thead>
                                    <tr>
                                        <th>Identifiant</th><th>Titre</th><th>Catégorie</th>
                                        <th>Statut</th><th>Priorité</th><th>Ouvert le</th><th>Clos le</th>
                                    </tr>
                                    </thead>
                                    <tbody id="assignesTableBody">
                                    <tr><td colspan="7" class="etat-vide">Chargement…</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </section>

            </div>
        </main>
    </div>
</div>

<!-- ============ MODAL D'INTERVENTION ============ -->
<div class="modal-fond" id="modalTicket" role="dialog" aria-modal="true" aria-labelledby="modalTitre">
    <div class="modal-boite">
        <div class="modal-entete">
            <div class="modal-titre">
                <span class="etiquette-modale" id="modalNumero">TKT-000000</span>
                <h3 id="modalTitre">Titre du ticket</h3>
            </div>
            <button type="button" class="modal-fermer" id="modalFermer" aria-label="Fermer">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div class="modal-corps">
            <div class="modal-bloc">
                <h4>Description</h4>
                <div class="modal-description" id="modalDescription"></div>
            </div>

            <div class="modal-bloc">
                <h4>Informations</h4>
                <div class="modal-infos" id="modalInfos"></div>
            </div>

            <div class="modal-bloc">
                <h4>Historique technique</h4>
                <div class="historique" id="modalHistorique"></div>
            </div>
        </div>

        <div class="modal-pied" id="modalActions" style="display:none;"></div>

        <form class="modal-pied" id="formIntervention">
            <label class="aide" id="labelIntervention" style="margin-bottom:8px;"></label>
            <textarea id="champIntervention" required
                      placeholder="Commentaire d'intervention : diagnostic, action menée, suite à donner…"></textarea>
            <button type="submit" class="btn-admin-primary">
                <i class="fas fa-floppy-disk"></i> Enregistrer l'intervention
            </button>
        </form>
    </div>
</div>
