<!-- ============ CONNEXION ============ -->
<div id="loginScreen" class="screen active">
    <div class="carte-connexion">

        <div class="connexion-marque">
            <img src="assets/logo-kipropha.png" alt="Kipropha" id="logoConnexion"
                 onerror="this.style.display='none'; document.getElementById('marqueRepli').style.display='block';">
            <span class="repli" id="marqueRepli">KIPROPHA</span>
            <h1>Application Helpdesk</h1>
        </div>

        <form class="login-form" id="loginForm" novalidate>
            <div class="form-group">
                <label for="loginEmail">Adresse e-mail</label>
                <input type="email" id="loginEmail"
                       autocomplete="username" required autofocus>
            </div>

            <div class="form-group password-group">
                <label for="loginPassword">Mot de passe</label>
                <input type="password" id="loginPassword" placeholder="••••••••"
                       autocomplete="current-password" required>
                <button type="button" class="password-toggle" onclick="togglePassword(this)"
                        aria-label="Afficher le mot de passe">
                    <i class="fas fa-eye"></i>
                </button>
            </div>

            <p class="message-champ" id="messageConnexion"></p>

            <button type="submit" class="btn-login" id="btnConnexion">Se connecter</button>
        </form>
    </div>
</div>
